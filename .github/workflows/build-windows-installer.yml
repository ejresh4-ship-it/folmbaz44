name: Build Windows Installer

on:
  push:
    branches:
      - main
      - master
      - archive/known-good-41409827776
      - feature/metadata-adapters-smart-bulk-organize
      - feature/desktop-integrated-lan-streaming
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - archive/known-good-41409827776
      - feature/desktop-integrated-lan-streaming
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Vite + Electron + NSIS installer
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmBaz-Setup-windows
          path: release/FilmBaz-Setup-*.exe
          if-no-files-found: error

# Trigger a fresh Windows installer build after enabling this branch.
